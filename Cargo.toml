[package]
name = "ramvault"
version = "0.1.0"
edition = "2024"
description = "macOS: short-lived credentials served from an in-memory FUSE vault that ejects itself when idle"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
zeroize = "1"

[profile.release]
strip = true
lto = true

[build-dependencies]
cc = "1"
pkg-config = "0.3"
